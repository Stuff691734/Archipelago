buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath "com.github.jengelman.gradle.plugins:shadow:2.0.4"
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: "com.github.johnrengelman.shadow"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

version = "${project.minecraft_version}-${project.mod_version}-forge"
group = mod_group_id

repositories {
    maven { url 'https://jitpack.io' }
    maven {
        url "https://cursemaven.com"
    }
    mavenLocal()
}


minecraft {
    version = "${minecraft_version}-${forge_version}"
    mappings = "${mapping_channel}_${mapping_version}"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation('io.github.archipelagomw:Java-Client:0.2.1')

    shadow ('io.github.archipelagomw:Java-Client:[0.2.1]')

    implementation "com.github.Stuff691734:archipelago-lib:0.11.3"
    shadow "com.github.Stuff691734:archipelago-lib:0.11.3"
}

shadowJar {
    project.configurations.shadow.setTransitive(true);
    configurations = [project.configurations.shadow]
    relocate("org.slf4j", "shadow.archipelago.org.slf4j")
    relocate("org.publicsuffix.list", "shadow.archipelago.org.publicsuffix.list")
    relocate("org.java_websocket", "shadow.archipelago.org.java_websocket")
    relocate("org.apache.hc", "shadow.archipelago.org.apache.hc")
    relocate("io.github.archipelagomw", "shadow.archipelago.io.github.archipelagomw")
    relocate("com.google.gson", "shadow.archipelago.com.google.gson")
    exclude 'META-INF/versions/**'
}

processResources {
    def replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes("Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : version,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "FMLCorePlugin": "net.stuff691734.archipelago.core.ArchipelagoCorePlugin",
                    "FMLCorePluginContainsFMLMod": true)
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

reobf {
    shadowJar {}
}

build.dependsOn reobfShadowJar